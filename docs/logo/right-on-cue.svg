<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1838"/>
      <stop offset="1" stop-color="#2e0715"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffc85c" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#velvet)"/>
  <!-- the spotlight: a lamp at the top, its beam, and the pool of light on the floor -->
  <path d="M27 9 L37 9 L53 52 L11 52 Z" fill="url(#beam)"/>
  <ellipse cx="32" cy="52" rx="22" ry="5" fill="url(#pool)"/>
  <rect x="26" y="5" width="12" height="6" rx="2" fill="#f2b43c"/>
  <!-- the envelope, centre stage -->
  <rect x="17" y="28" width="30" height="20" rx="2.5" fill="#fff8ea" stroke="#5c1027" stroke-width="1.6"/>
  <path d="M18 29.5 L32 40 L46 29.5" fill="none" stroke="#5c1027" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="32" cy="40" r="3" fill="#d4a017" stroke="#5c1027" stroke-width="1.2"/>
</svg>
