<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 4 280 352" width="815" height="1024">
<defs>
<linearGradient id="lamp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98A12"/><stop offset="0.35" stop-color="#FFE08A"/><stop offset="0.6" stop-color="#F5C542"/><stop offset="1" stop-color="#B8770A"/></linearGradient>
<linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7A928"/><stop offset="1" stop-color="#A86A08"/></linearGradient>
<radialGradient id="lens" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE7A0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEFC2" stop-opacity="0.85"/><stop offset="0.75" stop-color="#F7CF7A" stop-opacity="0.25"/><stop offset="1" stop-color="#F7CF7A" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFD87A" stop-opacity="0.9"/><stop offset="0.6" stop-color="#F2B947" stop-opacity="0.35"/><stop offset="1" stop-color="#F2B947" stop-opacity="0"/></radialGradient>
<linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4E5CB"/></linearGradient>
<linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E9D2"/><stop offset="1" stop-color="#ECD7B3"/></linearGradient>
<linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBF2E2"/></linearGradient>
<radialGradient id="gold" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF3B5"/><stop offset="0.5" stop-color="#F5C542"/><stop offset="1" stop-color="#C08210"/></radialGradient>
