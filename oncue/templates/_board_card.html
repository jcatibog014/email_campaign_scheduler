{# One cue card on the Call Board. #}
{% from "_icons.html" import icon %}
<a class="cue-card board-card{% if card.status == 'curtain_down' %} is-done{% endif %}{% if card.status in ('go', 'hold') %} is-live{% endif %}" href="{{ url_for('shows.page', show_id=card.show.id) }}">
  <span class="cue-card-time">{{ card.at|clock }}{% if card.repeat %} {{ icon('repeat', 13) }}<span class="visually-hidden"> (weekly)</span>{% endif %}</span>
  <strong class="cue-card-title">{{ card.show.name }}</strong>
  <span class="cue-card-meta">{{ card.label }}</span>
  <span class="board-stamp">{{ show_status(card.status) }}</span>
</a>
