# Alembic (database migrations) settings, for the command line:
#   .venv\Scripts\alembic revision --autogenerate -m "what changed" --rev-id 000N
# The app runs migrations itself with: flask --app oncue upgrade-db
[alembic]
script_location = oncue/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
